# The gallery catalog: one [[app]] table per card on the landing page.
#
# kind = "hosted": an example in this repo that the gallery runs under /<slug>. Needs `module`
#   (the file in examples/, without .py). The deployed indah version applies, so
#   `indah_version` is left out.
# kind = "listed": an app someone hosts elsewhere. The card links out and the gallery runs
#   nothing. Needs `url` (https), `thumbnail`, `source_url` and `indah_version`.
#
# thumbnail is a file name in deploy/fly/thumbnails/. A hosted entry without one shows an emoji tile.
# Rules are enforced by tests/unit/test_gallery_catalog.py. Plain text only: no HTML in any field.

[[app]]
slug = "chatbot"
