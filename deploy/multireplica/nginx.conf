# Two balancers in one nginx, for the multi-replica e2e (IND-211). Not a production config.
#
# :8081  plain spray: every request goes to a random replica, with no memory of the tab. This is
#        the hard case (no affinity at all).
# :8082  simulated Fly Proxy: a request with `fly-force-instance-id: <machine>` goes to that
#        machine; with no header it goes to any machine. A machine that is gone answers a plain
#        400, which is what indah's shell treats as "the machine is gone" (frontend/src/api.js).
#        The simulation is not Fly; the real run is in docs/spikes/multi-replica-e2e.md.
#
# Docker's resolver (127.0.0.11) is asked per request, so a replica that restarts with a new
# address is found again without reloading nginx.
events {}
http {
  resolver 127.0.0.11 valid=1s ipv6=off;
  access_log off;
  error_log /dev/stderr warn;

  split_clients "${request_id}" $any {
    33.3% r1:8000;
    33.3% r2:8000;
    *     r3:8000;
  }
  map $http_fly_force_instance_id $pinned {
    default "";
    n1 r1:8000;
    n2 r2:8000;
    n3 r3:8000;
  }
  map $pinned $fly_target {
    ""      $any;
    default $pinned;
  }
  map $http_fly_force_instance_id $unknown_machine {
    default 1;
    ""      0;
    n1      0;
    n2      0;
    n3      0;
  }

  server {
    listen 8081;
    location / {
      proxy_pass http://$any;
      include /etc/nginx/proxy_common.conf;
    }
  }

  server {
    listen 8082;
    location / {
      if ($unknown_machine) { return 400 "no such machine\n"; }
      proxy_pass http://$fly_target;
      error_page 502 503 504 = @gone;
      include /etc/nginx/proxy_common.conf;
    }
    location @gone {
      # Only a request that named a machine can be told it is gone; with no header Fly would
      # pick another machine, so a plain 502 is the honest answer here.
      if ($http_fly_force_instance_id = "") { return 502 "bad gateway\n"; }
      return 400 "machine is gone\n";
    }
  }
}
