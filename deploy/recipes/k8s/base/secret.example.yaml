# NOT part of the kustomization. Create the secret from the command line so it never lands in git:
#   kubectl -n indah create secret generic indah-secrets \
#     --from-literal=INDAH_DOCTOR_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=INDAH_SECRET="$(openssl rand -hex 32)"
# INDAH_SECRET is only read for create_app(secure=True). Restart the pods after changing it.
apiVersion: v1
kind: Secret
metadata:
  name: indah-secrets
  namespace: indah
type: Opaque
stringData:
  INDAH_DOCTOR_TOKEN: "replace-with-16-or-more-random-characters"
