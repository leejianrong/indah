apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: indah-app
spec:
  ingressClassName: traefik
  rules:
    - host: indah.example.com     # your host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: indah-app
                port: { name: http }
