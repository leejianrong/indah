<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indah</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16C11.7 12.4 11.7 6 16 3.6C20.3 6 20.3 12.4 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C20.3 19.6 20.3 26 16 28.4C11.7 26 11.7 19.6 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C12.4 20.3 6 20.3 3.6 16C6 11.7 12.4 11.7 16 16Z' fill='%232e6d62'/%3E%3Cpath d='M16 16C19.6 20.3 26 20.3 28.4 16C26 11.7 19.6 11.7 16 16Z' fill='%232e6d62'/%3E%3C/svg%3E"
    />
    <style>
      /* indah "Studio" theme (ADR-0014). A design-token layer: colour roles, shape,
         elevation, type. A theme is this token set; components below style through
         the tokens, never literals. Light is the base on :root; Studio dark is
         :root[data-theme="dark"]. A tiny <head> script resolves the user's choice
         (light / dark / system, in localStorage) into data-theme before first
         paint, so there is no flash and the toggle wins over the OS both ways. The
         Studio typefaces are self-hosted (src/fonts.css), so the shell still
         fetches nothing at runtime (ADR-0004). */
      :root {
        color-scheme: light;

        --bg: #faf6f0;
        --surface: #fffdf9;
        --surface-2: #f3ebe0;
        --surface-3: #ece0d1;
        --text: #241c22;
        --muted: #6e6169;
        --outline: #e0d4c6;
        --outline-soft: #eee3d6;

        --primary: #b5296b;
        --on-primary: #ffffff;
        --primary-container: #ffd9e7;
        --secondary: #2e6d62;
        --on-secondary: #ffffff;
        --secondary-container: #c9ece4;

        --ok: #2e6d47;
        --warn: #8a5300;
        --err: #c0362c;

        --shadow: 0 2px 5px -2px rgba(90, 20, 55, 0.16),
          0 12px 28px -16px rgba(90, 20, 55, 0.22);
        --radius: 14px;
        --radius-sm: 10px;
        --radius-pill: 24px;

        --font-display: "Bricolage Grotesque", system-ui, sans-serif;
        --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo,
          monospace;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;

        --bg: #191319;
        --surface: #221b22;
        --surface-2: #2c232c;
        --surface-3: #382d38;
        --text: #f1e7ee;
        --muted: #bda9b6;
        --outline: #4a3d48;
        --outline-soft: #332833;

        --primary: #f06ca6;
        --on-primary: #5a0d38;
        --primary-container: #5a1740;
        --secondary: #66b7a6;
        --on-secondary: #00382f;
        --secondary-container: #1f4d44;

        --ok: #7fd39a;
        --warn: #f0c04c;
        --err: #ffb4ab;

        --shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5),
          0 12px 30px -16px rgba(0, 0, 0, 0.6);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 var(--font-body);
        color: var(--text);
        background: var(--bg);
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      /* The app frame: content floats on the warm page ground, no chrome itself. */
      .shell { max-width: 1080px; margin: 0 auto; }

      /* Card: a surface panel that floats on the ground (the Studio "panels on
         porcelain" look). The building block layout components sit inside. */
      .card {
        background: var(--surface);
        border: 1px solid var(--outline-soft);
        border-radius: var(--radius);
        padding: 1.4rem 1.5rem;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .card-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* brand lockup: Bunga mark + wordmark + theme toggle, on the page ground */
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 1.3rem;
      }
      .brand .mark { width: 28px; height: 28px; flex: none; display: block; }
      .brand .wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: -0.03em;
        color: var(--text);
      }
      .brand .spacer { margin-left: auto; }

      /* theme toggle: a compact segmented control (system / light / dark) */
      .theme-toggle {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-pill);
      }
      .theme-toggle button {
        font: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .theme-toggle button:hover { filter: none; color: var(--text); }
      .theme-toggle button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--primary);
        box-shadow: var(--shadow);
      }
      .theme-toggle svg { width: 15px; height: 15px; }

      .column { display: flex; flex-direction: column; gap: 1rem; }

      /* Layout containers (ADR-0015). Arrangement only; styled through the tokens.
         Row/Grid take gap + columns as inline style from static props. */
      .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: stretch; }
      .row > * { flex: 1 1 0; min-width: 0; }
      .grid { display: grid; gap: 1rem; }
      .sidebar-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
      .sidebar-layout > .sidebar-aside { flex: 0 0 min(240px, 34%); }
      .sidebar-layout > .sidebar-main { flex: 1 1 0; min-width: 0; }
      /* Collapse multi-column layouts to a single column on a phone. !important
         beats the inline grid-template-columns set from the columns prop. */
      @media (max-width: 560px) {
        .grid { grid-template-columns: 1fr !important; }
        .sidebar-layout { flex-direction: column; }
        .sidebar-layout > .sidebar-aside { flex: none; width: 100%; }
      }

      .tabs { display: flex; flex-direction: column; gap: 0.9rem; }
      .tablist {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem;
        border-bottom: 1px solid var(--outline-soft);
      }
      .tab {
        font: inherit;
        font-weight: 600;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        align-self: auto;
      }
      .tab:hover { filter: none; color: var(--text); }
      .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
      .tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

      .expander {
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        background: var(--surface);
        overflow: hidden;
      }
      .expander-summary {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        font: inherit;
        font-weight: 600;
        color: var(--text);
        background: var(--surface-2);
        border: 0;
        border-radius: 0;
        padding: 0.6rem 0.9rem;
        cursor: pointer;
        align-self: auto;
        text-align: left;
      }
      .expander-summary:hover { filter: none; background: var(--surface-3); }
      .expander-caret {
        font-size: 0.7rem;
        color: var(--muted);
        transition: transform 0.15s ease;
      }
      .expander.open .expander-caret { transform: rotate(90deg); }
      .expander-body { display: flex; flex-direction: column; gap: 1rem; padding: 0.9rem; }

      /* Data-driven list / chat / gallery (ADR-0016). */
      .list { display: flex; flex-direction: column; gap: 0.4rem; }
      .list-item { font-size: 0.92rem; color: var(--text); }
      .list-empty { font-size: 0.9rem; color: var(--muted); font-style: italic; }
      /* one worked item template: a timestamped activity line (a code + a span) */
      .log-line { display: flex; gap: 0.55rem; align-items: baseline; }
      .log-line code {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--muted);
        flex: none;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        max-height: 22rem;
        overflow-y: auto;
        padding: 0.4rem;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .chat:empty::after { content: "No messages yet."; color: var(--muted); font-style: italic; }
      .bubble { display: flex; flex-direction: column; gap: 0.2rem; max-width: 85%; }
      .bubble-role {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .bubble-body {
        padding: 0.5rem 0.75rem;
        font-size: 0.92rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--outline-soft);
      }
      .bubble.role-user { align-self: flex-end; align-items: flex-end; }
      .bubble.role-user .bubble-body {
        color: var(--on-primary);
        background: var(--primary);
        border-color: transparent;
      }
      .bubble.role-system { align-self: center; max-width: 100%; }
      .bubble.role-system .bubble-body {
        background: transparent;
        border: 0;
        color: var(--muted);
        font-size: 0.82rem;
        text-align: center;
      }
      .bubble.pending .bubble-body::after {
        content: "▍";
        color: var(--primary);
        animation: indah-blink 1s step-end infinite;
      }
      @keyframes indah-blink { 50% { opacity: 0; } }
      .gallery { display: grid; gap: 0.6rem; }
      .gallery-item { margin: 0; }
      .gallery-item img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: var(--radius-sm);
        display: block;
        background: var(--surface-2);
      }
      .gallery-item figcaption {
        margin-top: 0.25rem;
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 560px) {
        .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      }

      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field label, .stream-label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--muted);
      }

      input[type="range"] { width: 100%; accent-color: var(--primary); }
      input[type="text"], input[type="number"], input[type="date"], select {
        font: inherit;
        width: 100%;
        padding: 0.55rem 0.75rem;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input[type="text"]::placeholder { color: var(--muted); }
      input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
      }
      select[multiple] { min-height: 5.5rem; }
      .check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.95rem;
        color: var(--text);
        cursor: pointer;
      }
      .check input { accent-color: var(--primary); width: 1.05rem; height: 1.05rem; flex: none; }
      .radio-group { display: flex; flex-direction: column; gap: 0.45rem; }
      input[type="color"] {
        width: 3rem;
        height: 2rem;
        padding: 2px;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .upload input[type="file"] {
        font: inherit;
        color: var(--text);
        padding: 0.4rem;
        background: var(--surface-2);
        border: 1px dashed var(--outline);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .upload-status { font-size: 0.85rem; color: var(--muted); }

      a.download {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        align-self: start;
        padding: 0.45rem 0.9rem;
        font-size: 0.95rem;
        color: var(--primary);
        text-decoration: none;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      a.download:hover { border-color: var(--primary); }
      .download.disabled { color: var(--muted); opacity: 0.6; }

      .image { max-width: 100%; border-radius: var(--radius-sm); display: block; }
      /* Client chart (uPlot, ADR-0018). Draw it on a surface and pull uPlot's
         chrome onto the Studio tokens so it reads in light and dark. */
      .chart { width: 100%; }
      .chart .u-title {
        font-family: var(--font-display); font-size: 0.95rem; color: var(--text);
      }
      .chart .u-legend { font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); }
      .chart .u-legend .u-value { color: var(--text); }
      /* Client heatmap / 2-D field (ADR-0019). */
      .heatmap { width: 100%; display: flex; flex-direction: column; gap: 0.3rem; }
      .heatmap-title { font-family: var(--font-display); font-size: 0.95rem; color: var(--text); }
      .heatmap canvas {
        width: 100%; display: block; border-radius: var(--radius-sm);
        image-rendering: pixelated; background: var(--surface-2);
      }
      .table-scroll { overflow-x: auto; }
      .dataframe { border-collapse: collapse; font-size: 0.9rem; width: 100%; }
      .dataframe th, .dataframe td {
        border: 1px solid var(--outline-soft);
        padding: 0.35rem 0.6rem;
        text-align: left;
        white-space: nowrap;
      }
      .dataframe th {
        background: var(--surface-2);
        font-weight: 600;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .dataframe td { font-variant-numeric: tabular-nums; }
      /* Interactive Table (ADR-0021): sortable headers, selectable rows, pager. */
      .table th { padding: 0; }
      .table .th-sort {
        display: flex; align-items: center; gap: 0.4rem; width: 100%;
        padding: 0.35rem 0.6rem; background: none; border: none; cursor: pointer;
        font: inherit; color: inherit; text-align: left;
      }
      .table .th-sort:hover { background: var(--surface-3); }
      .table .sort-caret { color: var(--muted); font-size: 0.7rem; }
      .table.selectable tbody tr { cursor: pointer; }
      .table.selectable tbody tr:hover { background: var(--surface-2); }
      .table tbody tr.selected { background: var(--primary-container); }
      .table-pager {
        display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem;
        font-size: 0.85rem; color: var(--muted);
      }
      .table-pager button { padding: 0.2rem 0.7rem; font-size: 0.85rem; }
      /* Metric / KPI card (ADR-0021). */
      .stat {
        display: flex; flex-direction: column; gap: 0.15rem;
        background: var(--surface); border: 1px solid var(--outline-soft);
        border-radius: var(--radius-sm); padding: 0.8rem 1rem;
      }
      .stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
      .stat-value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
      .stat-delta { font-size: 0.85rem; font-weight: 600; color: var(--ok); }
      .stat-delta.down { color: var(--err); }
      .stat-help { font-size: 0.78rem; color: var(--muted); }
      .text { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .streamtext {
        min-height: 3.5rem;
        padding: 0.7rem 0.9rem;
        font-size: 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .streamtext:empty::after { content: "…"; color: var(--muted); }

      /* Markdown rendered from the safe block tree (src/indah/markdown.py). */
      .markdown { font-size: 0.95rem; line-height: 1.6; color: var(--text); }
      .markdown > :first-child { margin-top: 0; }
      .markdown > :last-child { margin-bottom: 0; }
      .markdown h1, .markdown h2, .markdown h3, .markdown h4,
      .markdown h5, .markdown h6 {
        line-height: 1.25;
        margin: 0.7em 0 0.35em;
        font-family: var(--font-display);
        font-weight: 700;
      }
      .markdown h1 { font-size: 1.5rem; }
      .markdown h2 { font-size: 1.3rem; }
      .markdown h3 { font-size: 1.12rem; }
      .markdown h4, .markdown h5, .markdown h6 { font-size: 1rem; }
      .markdown p { margin: 0.5em 0; }
      .markdown a { color: var(--primary); text-decoration: underline; }
      .markdown strong { font-weight: 700; }
      .markdown code {
        font-family: var(--font-mono);
        font-size: 0.88em;
        background: var(--surface-2);
        padding: 0.1em 0.35em;
        border-radius: 6px;
      }
      .markdown pre {
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        padding: 0.8rem 0.9rem;
        overflow-x: auto;
      }
      .markdown pre code { background: none; padding: 0; font-size: 0.85rem; }
      .markdown ul, .markdown ol { margin: 0.4em 0; padding-left: 1.4em; }
      .markdown li { margin: 0.2em 0; }
      .markdown blockquote {
        margin: 0.5em 0;
        padding: 0.2em 0.9em;
        border-left: 3px solid var(--outline);
        color: var(--muted);
      }
      .markdown hr { border: 0; border-top: 1px solid var(--outline-soft); margin: 0.9em 0; }

      /* Progress bar + spinner (Slice A). */
      .progress {
        width: 100%;
        height: 0.6rem;
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        border-radius: var(--radius-pill);
        overflow: hidden;
        background: var(--surface-3);
        color: var(--primary); /* Firefox indeterminate fill */
      }
      .progress::-webkit-progress-bar { background: var(--surface-3); border-radius: var(--radius-pill); }
      .progress::-webkit-progress-value { background: var(--primary); border-radius: var(--radius-pill); }
      .progress::-moz-progress-bar { background: var(--primary); border-radius: var(--radius-pill); }
      .spinner-box {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .spinner {
        width: 1.1rem;
        height: 1.1rem;
        flex: none;
        border-radius: 50%;
        border: 2.5px solid var(--surface-3);
        border-top-color: var(--primary);
        animation: indah-spin 0.7s linear infinite;
      }
      @keyframes indah-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }

      button {
        font: inherit;
        font-weight: 600;
        color: var(--on-primary);
        background: var(--primary);
        border: 0;
        border-radius: var(--radius-pill);
        padding: 0.55rem 1.3rem;
        cursor: pointer;
        align-self: flex-start;
        transition: filter 0.15s, transform 0.05s;
      }
      button:hover { filter: brightness(1.06); }
      button:active { transform: translateY(1px); }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      /* Studio secondary actions: tonal (teal container) and ghost (outline). */
      button.tonal { color: var(--text); background: var(--secondary-container); }
      button.tonal:hover { filter: brightness(0.97); }
      button.ghost {
        color: var(--primary);
        background: transparent;
        border: 1px solid var(--outline);
      }
      button.ghost:hover { filter: none; background: var(--surface-2); }

      .status {
        margin-top: 1.4rem;
        font-size: 0.75rem;
        color: var(--muted);
        font-family: var(--font-mono);
        display: flex;
        gap: 0.45rem;
        align-items: center;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        transform: translateX(-50%);
        max-width: min(520px, 92vw);
        padding: 0.7rem 1rem;
        font: inherit;
        font-size: 0.85rem;
        text-align: left;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--outline);
        border-left: 3px solid var(--err);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow);
        cursor: pointer;
      }
    </style>
    <script>
      // Resolve the saved theme choice (light / dark / system) into data-theme
      // before first paint, so dark never flashes light. The toggle in the shell
      // writes localStorage["indah-theme"]; "system" (the default) follows the OS.
      (function () {
        try {
          var choice = localStorage.getItem("indah-theme") || "system";
          var dark =
            choice === "dark" ||
            (choice === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
