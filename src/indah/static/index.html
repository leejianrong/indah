<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indah</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16C11.7 12.4 11.7 6 16 3.6C20.3 6 20.3 12.4 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C20.3 19.6 20.3 26 16 28.4C11.7 26 11.7 19.6 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C12.4 20.3 6 20.3 3.6 16C6 11.7 12.4 11.7 16 16Z' fill='%232e6d62'/%3E%3Cpath d='M16 16C19.6 20.3 26 20.3 28.4 16C26 11.7 19.6 11.7 16 16Z' fill='%232e6d62'/%3E%3C/svg%3E"
    />
    <style>
      /* indah "Studio" theme (ADR-0014). A design-token layer: colour roles, shape,
         elevation, type. A theme is this token set; components below style through
         the tokens, never literals. Light is the base on :root; Studio dark is
         :root[data-theme="dark"]. A tiny <head> script resolves the user's choice
         (light / dark / system, in localStorage) into data-theme before first
         paint, so there is no flash and the toggle wins over the OS both ways. The
         Studio typefaces are self-hosted (src/fonts.css), so the shell still
         fetches nothing at runtime (ADR-0004). */
      :root {
        color-scheme: light;

        --bg: #faf6f0;
        --surface: #fffdf9;
        --surface-2: #f3ebe0;
        --surface-3: #ece0d1;
        --text: #241c22;
        --muted: #6e6169;
        --outline: #e0d4c6;
        --outline-soft: #eee3d6;

        /* The Bunga mark: brand identity, not a theme role, so an app Theme never recolours it. */
        --brand-a: #b5296b;
        --brand-b: #2e6d62;
        --primary: #b5296b;
        --on-primary: #ffffff;
        --primary-container: #ffd9e7;
        --on-primary-container: #3d0a24;
        --secondary: #2e6d62;
        --on-secondary: #ffffff;
        --secondary-container: #c9ece4;
        --on-secondary-container: #0d3a31;

        --ok: #2e6d47;
        --warn: #8a5300;
        --err: #c0362c;

        --shadow: 0 2px 5px -2px rgba(90, 20, 55, 0.16),
          0 12px 28px -16px rgba(90, 20, 55, 0.22);
        --radius: 14px;
        --radius-sm: 10px;
        --radius-pill: 24px;
        --radius-control: var(--radius-pill);  /* buttons and badges; Theme(radius=) sets it */

        --font-display: "Bricolage Grotesque", system-ui, sans-serif;
        --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo,
          monospace;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;

        --bg: #191319;
        --surface: #221b22;
        --surface-2: #2c232c;
        --surface-3: #382d38;
        --text: #f1e7ee;
        --muted: #bda9b6;
        --outline: #4a3d48;
        --outline-soft: #332833;

        --brand-a: #f06ca6;
        --brand-b: #66b7a6;
        --primary: #f06ca6;
        --on-primary: #5a0d38;
        --primary-container: #5a1740;
        --on-primary-container: #ffd9e7;
        --secondary: #66b7a6;
        --on-secondary: #00382f;
        --secondary-container: #1f4d44;
        --on-secondary-container: #c9ece4;

        --ok: #7fd39a;
        --warn: #f0c04c;
        --err: #ffb4ab;

        --shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5),
          0 12px 30px -16px rgba(0, 0, 0, 0.6);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 var(--font-body);
        color: var(--text);
        background: var(--bg);
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      /* The app frame: content floats on the warm page ground, no chrome itself. */
      .shell { max-width: var(--page-max, 1080px); margin: 0 auto; }
      /* An AppShell (IND-147) sizes itself: rail plus main, main keeping max_width. */
      .shell:has(.appshell) { max-width: none; }

      /* Card: a surface panel that floats on the ground (the Studio "panels on
         porcelain" look). The building block layout components sit inside. */
      .card {
        background: var(--surface);
        border: 1px solid var(--outline-soft);
        border-radius: var(--radius);
        padding: 1.4rem 1.5rem;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      /* Card variants (IND-146). Outlined is the default look above. */
      .card.card-flat { background: none; border-color: transparent; box-shadow: none; }
      .card.card-tonal { background: var(--surface-2); border-color: transparent; box-shadow: none; }
      .card-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* brand lockup: Bunga mark + wordmark + theme toggle, on the page ground */
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 1.3rem;
      }
      .brand .brand-id {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
        color: inherit;
      }
      a.brand-id { cursor: pointer; }
      a.brand-id:hover .wordmark { color: var(--primary); }
      .brand .mark { width: 28px; height: 28px; flex: none; display: block; object-fit: contain; }
      /* A (light, dark) logo pair: the data-theme the toggle sets picks the mark. */
      .brand .mark-dark { display: none; }
      :root[data-theme="dark"] .brand .mark-light { display: none; }
      :root[data-theme="dark"] .brand .mark-dark { display: block; }
      .brand .wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: -0.03em;
        color: var(--text);
      }
      .brand .spacer { margin-left: auto; }
      .brand .source-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-right: 0.6rem;
        padding: 0.3rem 0.6rem;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: none;
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .brand .source-link:hover { color: var(--text); border-color: var(--primary); }

      /* theme toggle: a compact segmented control (system / light / dark) */
      .theme-toggle {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-pill);
      }
      .theme-toggle button {
        font: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .theme-toggle button:hover { filter: none; color: var(--text); }
      .theme-toggle button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--primary);
        box-shadow: var(--shadow);
      }
      .theme-toggle svg { width: 15px; height: 15px; }

      .column { display: flex; flex-direction: column; gap: 1rem; }

      /* Layout containers (ADR-0015). Arrangement only; styled through the tokens.
         Row/Grid take gap + columns as inline style from static props. */
      .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: stretch; }
      .row > * { flex: 1 1 0; min-width: 0; }
      /* An explicit align= means "size to content": buttons and badges stop stretching. */
      .row.fit > button, .row.fit > .badge { flex: 0 0 auto; }
      /* justify= or a Spacer means the children size to their content, not the shared width. */
      .row.justified > *, .row:has(> .spacer) > * { flex: 0 1 auto; }
      .row > .spacer { flex: 1 1 0; }
      .spacer { min-width: 0; min-height: 0; }
      .divider { border: 0; background: var(--outline-soft); margin: 0; flex: 0 0 auto; }
      hr.divider { height: 1px; width: 100%; align-self: stretch; }
      .divider-vertical { width: 1px; align-self: stretch; }
      .row > .divider-vertical { flex: 0 0 1px; }
      .grid { display: grid; gap: 1rem; }
      .sidebar-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
      .sidebar-layout > .sidebar-aside { flex: 0 0 min(240px, 34%); }
      .sidebar-layout > .sidebar-main { flex: 1 1 0; min-width: 0; }
      /* Collapse multi-column layouts to a single column on a phone. !important
         beats the inline grid-template-columns set from the columns prop. */
      @media (max-width: 560px) {
        .grid { grid-template-columns: 1fr !important; }
        .sidebar-layout { flex-direction: column; }
        .sidebar-layout > .sidebar-aside { flex: none; width: 100%; }
      }

      .tabs { display: flex; flex-direction: column; gap: 0.9rem; }
      .tablist {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem;
        border-bottom: 1px solid var(--outline-soft);
      }
      .tab {
        font: inherit;
        font-weight: 600;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        align-self: auto;
      }
      .tab:hover { filter: none; color: var(--text); }
      .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
      .tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

      .expander {
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        background: var(--surface);
        overflow: hidden;
      }
      .expander-summary {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        font: inherit;
        font-weight: 600;
        color: var(--text);
        background: var(--surface-2);
        border: 0;
        border-radius: 0;
        padding: 0.6rem 0.9rem;
        cursor: pointer;
        align-self: auto;
        text-align: left;
      }
      .expander-summary:hover { filter: none; background: var(--surface-3); }
      .expander-caret {
        font-size: 0.7rem;
        color: var(--muted);
        transition: transform 0.15s ease;
      }
      .expander.open .expander-caret { transform: rotate(90deg); }
      .expander-body { display: flex; flex-direction: column; gap: 1rem; padding: 0.9rem; }

      /* Data-driven list / chat / gallery (ADR-0016). */
      .list { display: flex; flex-direction: column; gap: 0.4rem; }
      .list-item { font-size: 0.92rem; color: var(--text); }
      .list-empty { font-size: 0.9rem; color: var(--muted); font-style: italic; }
      /* one worked item template: a timestamped activity line (a code + a span) */
      .log-line { display: flex; gap: 0.55rem; align-items: baseline; }
      .log-line code {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--muted);
        flex: none;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        /* Fixed height (not a cap): the space is allocated up front so the box never
           stretches message by message - it just scrolls, like ChatGPT/Gemini. */
        height: 22rem;
        overflow-y: auto;
        padding: 0.4rem;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .chat:empty::after { content: "No messages yet."; color: var(--muted); font-style: italic; }
      .bubble { display: flex; flex-direction: column; gap: 0.2rem; max-width: 85%; }
      .bubble-role {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .bubble-body {
        padding: 0.5rem 0.75rem;
        font-size: 0.92rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--outline-soft);
      }
      .bubble.role-user { align-self: flex-end; align-items: flex-end; }
      .bubble.role-user .bubble-body {
        color: var(--on-primary);
        background: var(--primary);
        border-color: transparent;
      }
      .bubble.role-system { align-self: center; max-width: 100%; }
      .bubble.role-system .bubble-body {
        background: transparent;
        border: 0;
        color: var(--muted);
        font-size: 0.82rem;
        text-align: center;
      }
      .bubble.pending .bubble-body::after {
        content: "▍";
        color: var(--primary);
        animation: indah-blink 1s step-end infinite;
      }
      @keyframes indah-blink { 50% { opacity: 0; } }
      .gallery { display: grid; gap: 0.6rem; }
      .gallery-item { margin: 0; }
      .gallery-item img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: var(--radius-sm);
        display: block;
        background: var(--surface-2);
      }
      .gallery-item figcaption {
        margin-top: 0.25rem;
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 560px) {
        .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      }

      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field label, .stream-label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--muted);
      }

      input[type="range"] { width: 100%; accent-color: var(--primary); }
      input[type="text"], input[type="number"], input[type="date"], input[type="search"],
      select, textarea {
        font: inherit;
        width: 100%;
        padding: 0.55rem 0.75rem;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      textarea { resize: vertical; line-height: 1.45; }
      input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
      input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus,
      input[type="search"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
      }
      select[multiple] { min-height: 5.5rem; }
      .check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.95rem;
        color: var(--text);
        cursor: pointer;
      }
      .check input { accent-color: var(--primary); width: 1.05rem; height: 1.05rem; flex: none; }
      .checkbox-fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
      .checkbox-fieldset legend { padding: 0; margin-bottom: 0.35rem; }
      .radio-group { display: flex; flex-direction: column; gap: 0.45rem; }
      .choice { --tone: var(--primary); display: flex; flex-wrap: wrap; gap: 0.4rem; }
      .choice-opt.tone-ok { --tone: var(--ok); }
      .choice-opt.tone-warn { --tone: var(--warn); }
      .choice-opt.tone-err { --tone: var(--err); }
      .choice-opt.tone-info { --tone: var(--primary); }
      button.choice-opt {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        align-self: auto;
        padding: 0.3rem 0.85rem;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: var(--radius-control);
        filter: none;
      }
      button.choice-opt:hover { background: var(--surface-2); filter: none; }
      button.choice-opt.tone-ok, button.choice-opt.tone-warn,
      button.choice-opt.tone-err, button.choice-opt.tone-info { color: var(--tone); }
      button.choice-opt.on {
        color: var(--on-primary-container);
        background: color-mix(in srgb, var(--tone) 16%, var(--surface));
        border-color: var(--tone);
      }
      button.choice-opt.on.tone-ok, button.choice-opt.on.tone-warn,
      button.choice-opt.on.tone-err, button.choice-opt.on.tone-info { color: var(--tone); }
      .choice-count {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0 0.4rem;
        border-radius: var(--radius-control);
        background: color-mix(in srgb, var(--tone) 14%, var(--surface-2));
        color: var(--muted);
      }
      .choice.segmented {
        display: inline-flex;
        flex-wrap: nowrap;
        gap: 0;
        align-self: flex-start;
        border: 1px solid var(--outline);
        border-radius: var(--radius-control);
        overflow: hidden;
        background: var(--surface);
      }
      .choice.segmented button.choice-opt {
        border: 0;
        border-radius: 0;
        padding: 0.4rem 1rem;
        background: transparent;
      }
      .choice.segmented button.choice-opt + button.choice-opt { border-left: 1px solid var(--outline); }
      .choice.segmented button.choice-opt.on {
        background: var(--tone);
        color: var(--on-primary);
      }
      .choice.segmented button.choice-opt.on .choice-count {
        background: color-mix(in srgb, var(--on-primary) 24%, transparent);
        color: var(--on-primary);
      }
      button.choice-opt:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .choice.segmented button.choice-opt:focus-visible { outline-offset: -3px; }
      input[type="color"] {
        width: 3rem;
        height: 2rem;
        padding: 2px;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .upload input[type="file"] {
        font: inherit;
        color: var(--text);
        padding: 0.4rem;
        background: var(--surface-2);
        border: 1px dashed var(--outline);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .upload-status { font-size: 0.85rem; color: var(--muted); }

      a.download {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        align-self: start;
        padding: 0.45rem 0.9rem;
        font-size: 0.95rem;
        color: var(--primary);
        text-decoration: none;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      a.download:hover { border-color: var(--primary); }
      .download.disabled { color: var(--muted); opacity: 0.6; }

      .image { max-width: 100%; border-radius: var(--radius-sm); display: block; }
      .map { width: 100%; border-radius: var(--radius-sm); overflow: hidden; }
      .audio { max-width: 100%; width: 100%; display: block; }
      .audio-empty {
        display: inline-block; padding: 0.5rem 0.8rem; color: var(--muted);
        background: var(--surface-2); border: 1px dashed var(--outline);
        border-radius: var(--radius-sm); font-size: 0.9rem;
      }
      /* Image overlay (ADR-0020): boxes/masks/keypoints over an image, in % coords.
         .overlay-wrap is a fixed-size, overflow:hidden viewport (so a caller's
         out-of-[0,1] box, or a label pushed above a box near the top edge, is
         clipped rather than bleeding into surrounding page content); .ov-content is
         the one layer that gets scaled/panned for zoom (#77), so box/point percent
         coordinates need no adjustment at any zoom level. */
      .overlay-wrap {
        position: relative; display: inline-block; max-width: 100%; line-height: 0;
        overflow: hidden; touch-action: none;
      }
      .overlay-wrap.zoomed { cursor: grab; }
      .overlay-wrap.dragging { cursor: grabbing; }
      .ov-content { display: inline-block; }
      .overlay-wrap .image { width: 100%; }
      .ov-reset-btn {
        position: absolute; top: 0.5rem; right: 0.5rem; z-index: 1;
        font: 600 0.72rem/1 var(--font-body); padding: 0.35rem 0.6rem;
        border: 1px solid var(--outline); border-radius: var(--radius-sm);
        background: var(--surface); color: var(--text); cursor: pointer;
        box-shadow: var(--shadow);
      }
      .ov-reset-btn:hover { border-color: var(--primary); color: var(--primary); }
      .ov-mask {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border-radius: var(--radius-sm); pointer-events: none;
      }
      .ov-box {
        position: absolute; border: 2px solid var(--primary); border-radius: 3px;
        box-sizing: border-box; pointer-events: none;
      }
      /* label_mode="hover": no permanent .ov-label span, just a native `title`
         tooltip - needs pointer-events re-enabled to actually be a hover target. */
      .ov-box--hover { pointer-events: auto; cursor: default; }
      .ov-label {
        position: absolute; top: 0; left: 0; transform: translateY(-100%);
        font: 600 0.72rem/1.4 var(--font-body); color: #fff; padding: 0 0.35rem;
        white-space: nowrap; border-radius: 3px 3px 0 0;
      }
      .ov-point {
        position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
        border: 2px solid #fff; border-radius: 50%; pointer-events: auto;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
      }
      /* Client chart (uPlot, ADR-0018). Draw it on a surface and pull uPlot's
         chrome onto the Studio tokens so it reads in light and dark. */
      .chart { width: 100%; }
      .chart .u-title {
        font-family: var(--font-display); font-size: 0.95rem; color: var(--text);
      }
      .chart .u-legend { font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); }
      .chart .u-legend .u-value { color: var(--text); }
      /* Client heatmap / 2-D field (ADR-0019). */
      .heatmap { width: 100%; display: flex; flex-direction: column; gap: 0.3rem; }
      .heatmap-title { font-family: var(--font-display); font-size: 0.95rem; color: var(--text); }
      .heatmap canvas {
        width: 100%; display: block; border-radius: var(--radius-sm);
        image-rendering: pixelated; background: var(--surface-2);
      }
      .table-scroll { overflow-x: auto; }
      /* Density tokens: the app default comes from <html data-density>, one table can
         override with its own data-density. --row-h is the fixed row of a virtual table. */
      :root { --row-h: 36px; --cell-pad-y: 0.35rem; --cell-pad-x: 0.6rem; --table-font: 0.9rem; }
      [data-density="compact"] {
