<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indah</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a2e;
        --muted: #6b7280;
        --bg: #f7f7fb;
        --card: #ffffff;
        --accent: #5b5bd6;
        --ok: #16a34a;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6e6f0;
          --muted: #9ca3af;
          --bg: #14141f;
          --card: #1e1e2e;
          --accent: #8b8bf0;
          --ok: #4ade80;
          --border: #2c2c3c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
        padding: 1.5rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.75rem 2rem;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        min-width: min(360px, 90vw);
      }
      h1 { margin: 0 0 1.25rem; font-size: 1.05rem; letter-spacing: 0.02em; }
      .column { display: flex; flex-direction: column; gap: 1rem; }
      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field label { font-size: 0.8rem; color: var(--muted); }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .text {
        font-size: 1.4rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 0.55rem 1.2rem;
        cursor: pointer;
        align-self: flex-start;
      }
      .status {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: var(--muted);
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.live { background: var(--ok); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>indah</h1>
      <div id="app"></div>
      <div class="status"><span class="dot" id="dot"></span><span id="state">connecting…</span></div>
    </main>

    <script>
      (function () {
        "use strict";
        var PROTOCOL_VERSION = 0;

        function apiUrl(path) {
          var base = location.href.split("#")[0].split("?")[0];
          if (!base.endsWith("/")) base += "/";
          return new URL(path, base).toString();
        }

        var appEl = document.getElementById("app");
        var dot = document.getElementById("dot");
        var stateEl = document.getElementById("state");
        var nodes = {}; // id -> { el, type, valueEl }

        function setStatus(live, text) {
          dot.classList.toggle("live", !!live);
          stateEl.textContent = text;
        }

        function postEvent(id, event, payload) {
          fetch(apiUrl("api/event"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ component: id, event: event, payload: payload || {} }),
          }).catch(function () {});
        }

        function render(node) {
          var props = node.props || {};
          var entry = { type: node.type };
          var el;

          if (node.type === "column") {
            el = document.createElement("div");
            el.className = "column";
            (node.children || []).forEach(function (child) {
              el.appendChild(render(child));
            });
          } else if (node.type === "text") {
            el = document.createElement("div");
            el.className = "text";
            el.textContent = props.text != null ? props.text : "";
          } else if (node.type === "button") {
            el = document.createElement("button");
            el.textContent = props.label != null ? props.label : "";
            el.addEventListener("click", function () {
              postEvent(node.id, "click");
            });
          } else if (node.type === "slider") {
            el = document.createElement("div");
            el.className = "field";
            var label = document.createElement("label");
            label.textContent = props.label || "";
            var input = document.createElement("input");
            input.type = "range";
            input.min = props.min;
            input.max = props.max;
            input.step = props.step;
            input.value = props.value;
            input.addEventListener("input", function () {
              postEvent(node.id, "input", { value: Number(input.value) });
            });
            el.appendChild(label);
            el.appendChild(input);
            entry.valueEl = input;
          } else {
            el = document.createElement("div");
            el.textContent = "[unknown: " + node.type + "]";
          }

          entry.el = el;
          nodes[node.id] = entry;
          return el;
        }

        function applyChange(change) {
          var entry = nodes[change.target];
          if (!entry) return;
          var props = change.props || {};
          if (entry.type === "text" && "text" in props) {
            entry.el.textContent = props.text;
          } else if (entry.type === "button" && "label" in props) {
            entry.el.textContent = props.label;
          } else if (entry.type === "slider" && "value" in props) {
            entry.valueEl.value = props.value;
          }
        }

        function applyMessage(msg) {
          if (!msg || msg.v !== PROTOCOL_VERSION) {
            setStatus(false, "protocol mismatch — reload");
            return;
          }
          if (msg.type === "init") {
            nodes = {};
            appEl.innerHTML = "";
            appEl.appendChild(render(msg.root));
          } else if (msg.type === "patch") {
            (msg.changes || []).forEach(applyChange);
          }
        }

        var source = new EventSource(apiUrl("api/stream"));
        source.onopen = function () { setStatus(true, "live"); };
        source.onmessage = function (e) {
          setStatus(true, "live");
          try { applyMessage(JSON.parse(e.data)); } catch (err) {}
        };
        source.onerror = function () { setStatus(false, "reconnecting…"); };
      })();
    </script>
  </body>
</html>
