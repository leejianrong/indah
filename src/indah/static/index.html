<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indah</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a2e;
        --muted: #6b7280;
        --bg: #f7f7fb;
        --card: #ffffff;
        --accent: #5b5bd6;
        --ok: #16a34a;
        --err: #dc2626;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6e6f0;
          --muted: #9ca3af;
          --bg: #14141f;
          --card: #1e1e2e;
          --accent: #8b8bf0;
          --ok: #4ade80;
          --err: #f87171;
          --border: #2c2c3c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
        padding: 1.5rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.75rem 2rem;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        min-width: min(360px, 90vw);
      }
      h1 { margin: 0 0 1.25rem; font-size: 1.05rem; letter-spacing: 0.02em; }
      .column { display: flex; flex-direction: column; gap: 1rem; }
      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field label, .stream-label { font-size: 0.8rem; color: var(--muted); }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      input[type="text"] {
        font: inherit;
        width: 100%;
        padding: 0.5rem 0.7rem;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      select {
        font: inherit;
        width: 100%;
        padding: 0.5rem 0.7rem;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      input[type="color"] {
        width: 3rem;
        height: 2rem;
        padding: 2px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
      }
      .image { max-width: 100%; border-radius: 8px; display: block; }
      .table-scroll { overflow-x: auto; }
      .dataframe { border-collapse: collapse; font-size: 0.9rem; width: 100%; }
      .dataframe th, .dataframe td {
        border: 1px solid var(--border);
        padding: 0.35rem 0.6rem;
        text-align: left;
        white-space: nowrap;
      }
      .dataframe th { background: var(--bg); font-weight: 600; }
      .text { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .streamtext {
        min-height: 3.5rem;
        padding: 0.7rem 0.9rem;
        font-size: 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .streamtext:empty::after { content: "…"; color: var(--muted); }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 0.55rem 1.2rem;
        cursor: pointer;
        align-self: flex-start;
      }
      .status {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: var(--muted);
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.live { background: var(--ok); }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        transform: translateX(-50%);
        max-width: min(520px, 92vw);
        padding: 0.7rem 1rem;
        font-size: 0.85rem;
        color: #fff;
        background: var(--err);
        border-radius: 10px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }
    </style>
