<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indah</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16C11.7 12.4 11.7 6 16 3.6C20.3 6 20.3 12.4 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C20.3 19.6 20.3 26 16 28.4C11.7 26 11.7 19.6 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C12.4 20.3 6 20.3 3.6 16C6 11.7 12.4 11.7 16 16Z' fill='%232e6d62'/%3E%3Cpath d='M16 16C19.6 20.3 26 20.3 28.4 16C26 11.7 19.6 11.7 16 16Z' fill='%232e6d62'/%3E%3C/svg%3E"
    />
    <style>
      /* indah "Studio" theme (ADR-0014). A design-token layer: colour roles, shape,
         elevation, type. A theme is this token set; components below style through
         the tokens, never literals. Fonts use a system stack so the shell fetches
         nothing at runtime (ADR-0004); bundling the display/mono faces is a later
         enhancement. */
      :root {
        color-scheme: light dark;

        --bg: #faf6f0;
        --surface: #fffdf9;
        --surface-2: #f3ebe0;
        --surface-3: #ece0d1;
        --text: #241c22;
        --muted: #6e6169;
        --outline: #e0d4c6;
        --outline-soft: #eee3d6;

        --primary: #b5296b;
        --on-primary: #ffffff;
        --primary-container: #ffd9e7;
        --secondary: #2e6d62;
        --secondary-container: #c9ece4;

        --ok: #2e6d47;
        --err: #c0362c;

        --shadow: 0 2px 5px -2px rgba(90, 20, 55, 0.16),
          0 12px 28px -16px rgba(90, 20, 55, 0.22);
        --radius: 14px;
        --radius-sm: 10px;
        --radius-pill: 24px;

        --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        --font-display: var(--font-body);
        --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo,
          monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191319;
          --surface: #221b22;
          --surface-2: #2c232c;
          --surface-3: #382d38;
          --text: #f1e7ee;
          --muted: #bda9b6;
          --outline: #4a3d48;
          --outline-soft: #332833;

          --primary: #f06ca6;
          --on-primary: #5a0d38;
          --primary-container: #5a1740;
          --secondary: #66b7a6;
          --secondary-container: #1f4d44;

          --ok: #7fd39a;
          --err: #ff8a7a;

          --shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5),
            0 12px 30px -16px rgba(0, 0, 0, 0.6);
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.5 var(--font-body);
        color: var(--text);
        background: var(--bg);
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--outline-soft);
        border-radius: var(--radius);
        padding: 1.75rem 2rem;
        box-shadow: var(--shadow);
        min-width: min(380px, 90vw);
      }

      /* brand lockup: Bunga mark + wordmark */
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 1.4rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--outline-soft);
      }
      .brand .mark { width: 26px; height: 26px; flex: none; display: block; }
      .brand .wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.35rem;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .column { display: flex; flex-direction: column; gap: 1rem; }
      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field label, .stream-label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--muted);
      }

      input[type="range"] { width: 100%; accent-color: var(--primary); }
      input[type="text"], select {
        font: inherit;
        width: 100%;
        padding: 0.55rem 0.75rem;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input[type="text"]::placeholder { color: var(--muted); }
      input[type="text"]:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
      }
      input[type="color"] {
        width: 3rem;
        height: 2rem;
        padding: 2px;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .image { max-width: 100%; border-radius: var(--radius-sm); display: block; }
      .table-scroll { overflow-x: auto; }
      .dataframe { border-collapse: collapse; font-size: 0.9rem; width: 100%; }
      .dataframe th, .dataframe td {
        border: 1px solid var(--outline-soft);
        padding: 0.35rem 0.6rem;
        text-align: left;
        white-space: nowrap;
      }
      .dataframe th {
        background: var(--surface-2);
        font-weight: 600;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .dataframe td { font-variant-numeric: tabular-nums; }
      .text { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .streamtext {
        min-height: 3.5rem;
        padding: 0.7rem 0.9rem;
        font-size: 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .streamtext:empty::after { content: "…"; color: var(--muted); }

      button {
        font: inherit;
        font-weight: 600;
        color: var(--on-primary);
        background: var(--primary);
        border: 0;
        border-radius: var(--radius-pill);
        padding: 0.55rem 1.3rem;
        cursor: pointer;
        align-self: flex-start;
        transition: filter 0.15s, transform 0.05s;
      }
      button:hover { filter: brightness(1.06); }
      button:active { transform: translateY(1px); }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .status {
        margin-top: 1.4rem;
        font-size: 0.75rem;
        color: var(--muted);
        font-family: var(--font-mono);
        display: flex;
        gap: 0.45rem;
        align-items: center;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        transform: translateX(-50%);
        max-width: min(520px, 92vw);
        padding: 0.7rem 1rem;
        font: inherit;
        font-size: 0.85rem;
        text-align: left;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--outline);
        border-left: 3px solid var(--err);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow);
        cursor: pointer;
      }
    </style>
