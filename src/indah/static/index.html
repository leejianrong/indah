<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indah</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16C11.7 12.4 11.7 6 16 3.6C20.3 6 20.3 12.4 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C20.3 19.6 20.3 26 16 28.4C11.7 26 11.7 19.6 16 16Z' fill='%23b5296b'/%3E%3Cpath d='M16 16C12.4 20.3 6 20.3 3.6 16C6 11.7 12.4 11.7 16 16Z' fill='%232e6d62'/%3E%3Cpath d='M16 16C19.6 20.3 26 20.3 28.4 16C26 11.7 19.6 11.7 16 16Z' fill='%232e6d62'/%3E%3C/svg%3E"
    />
    <style>
      /* indah "Studio" theme (ADR-0014). A design-token layer: colour roles, shape,
         elevation, type. A theme is this token set; components below style through
         the tokens, never literals. Light is the base on :root; Studio dark is
         :root[data-theme="dark"]. A tiny <head> script resolves the user's choice
         (light / dark / system, in localStorage) into data-theme before first
         paint, so there is no flash and the toggle wins over the OS both ways. The
         Studio typefaces are self-hosted (src/fonts.css), so the shell still
         fetches nothing at runtime (ADR-0004). */
      :root {
        color-scheme: light;

        --bg: #faf6f0;
        --surface: #fffdf9;
        --surface-2: #f3ebe0;
        --surface-3: #ece0d1;
        --text: #241c22;
        --muted: #6e6169;
        --outline: #e0d4c6;
        --outline-soft: #eee3d6;

        /* The Bunga mark: brand identity, not a theme role, so an app Theme never recolours it. */
        --brand-a: #b5296b;
        --brand-b: #2e6d62;
        --primary: #b5296b;
        --on-primary: #ffffff;
        --primary-container: #ffd9e7;
        --on-primary-container: #3d0a24;
        --secondary: #2e6d62;
        --on-secondary: #ffffff;
        --secondary-container: #c9ece4;
        --on-secondary-container: #0d3a31;

        --ok: #2e6d47;
        --warn: #8a5300;
        --err: #c0362c;

        --shadow: 0 2px 5px -2px rgba(90, 20, 55, 0.16),
          0 12px 28px -16px rgba(90, 20, 55, 0.22);
        --radius: 14px;
        --radius-sm: 10px;
        --radius-pill: 24px;
        --radius-control: var(--radius-pill);  /* buttons and badges; Theme(radius=) sets it */

        --font-display: "Bricolage Grotesque", system-ui, sans-serif;
        --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo,
          monospace;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;

        --bg: #191319;
        --surface: #221b22;
        --surface-2: #2c232c;
        --surface-3: #382d38;
        --text: #f1e7ee;
        --muted: #bda9b6;
        --outline: #4a3d48;
        --outline-soft: #332833;

        --brand-a: #f06ca6;
        --brand-b: #66b7a6;
        --primary: #f06ca6;
        --on-primary: #5a0d38;
        --primary-container: #5a1740;
        --on-primary-container: #ffd9e7;
        --secondary: #66b7a6;
        --on-secondary: #00382f;
        --secondary-container: #1f4d44;
        --on-secondary-container: #c9ece4;

        --ok: #7fd39a;
        --warn: #f0c04c;
        --err: #ffb4ab;

        --shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5),
          0 12px 30px -16px rgba(0, 0, 0, 0.6);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 var(--font-body);
        color: var(--text);
        background: var(--bg);
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      /* The app frame: content floats on the warm page ground, no chrome itself. */
      .shell { max-width: var(--page-max, 1080px); margin: 0 auto; }
      /* An AppShell (IND-147) sizes itself: rail plus main, main keeping max_width. */
      .shell:has(.appshell) { max-width: none; }

      /* Card: a surface panel that floats on the ground (the Studio "panels on
         porcelain" look). The building block layout components sit inside. */
      .card {
        background: var(--surface);
        border: 1px solid var(--outline-soft);
        border-radius: var(--radius);
        padding: 1.4rem 1.5rem;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      /* Card variants (IND-146). Outlined is the default look above. */
      .card.card-flat { background: none; border-color: transparent; box-shadow: none; }
      .card.card-tonal { background: var(--surface-2); border-color: transparent; box-shadow: none; }
      .card-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* brand lockup: Bunga mark + wordmark + theme toggle, on the page ground */
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 1.3rem;
      }
      .brand .brand-id {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
        color: inherit;
      }
      a.brand-id { cursor: pointer; }
      a.brand-id:hover .wordmark { color: var(--primary); }
      .brand .mark { width: 28px; height: 28px; flex: none; display: block; object-fit: contain; }
      /* A (light, dark) logo pair: the data-theme the toggle sets picks the mark. */
      .brand .mark-dark { display: none; }
      :root[data-theme="dark"] .brand .mark-light { display: none; }
      :root[data-theme="dark"] .brand .mark-dark { display: block; }
      .brand .wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: -0.03em;
        color: var(--text);
      }
      .brand .spacer { margin-left: auto; }
      /* quiet_status (IND-251): the lost-connection note beside the theme toggle. */
      .brand .status-head { margin: 0 0.8rem 0 0; }
      .brand .status-head .dot { background: var(--err); }
      .brand .source-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-right: 0.6rem;
        padding: 0.3rem 0.6rem;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: none;
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .brand .source-link:hover { color: var(--text); border-color: var(--primary); }

      /* theme toggle: a compact segmented control (system / light / dark) */
      .theme-toggle {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-pill);
      }
      .theme-toggle button {
        font: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .theme-toggle button:hover { filter: none; color: var(--text); }
      .theme-toggle button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--primary);
        box-shadow: var(--shadow);
      }
      .theme-toggle svg { width: 15px; height: 15px; }

      .column { display: flex; flex-direction: column; gap: 1rem; }

      /* Layout containers (ADR-0015). Arrangement only; styled through the tokens.
         Row/Grid take gap + columns as inline style from static props. */
      .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: stretch; }
      .row > * { flex: 1 1 0; min-width: 0; }
      /* An explicit align= means "size to content": buttons and badges stop stretching. */
      .row.fit > button, .row.fit > .badge { flex: 0 0 auto; }
      /* justify= or a Spacer means the children size to their content, not the shared width. */
      .row.justified > *, .row:has(> .spacer) > * { flex: 0 1 auto; }
      .row > .spacer { flex: 1 1 0; }
      .spacer { min-width: 0; min-height: 0; }
      .divider { border: 0; background: var(--outline-soft); margin: 0; flex: 0 0 auto; }
      hr.divider { height: 1px; width: 100%; align-self: stretch; }
      .divider-vertical { width: 1px; align-self: stretch; }
      .row > .divider-vertical { flex: 0 0 1px; }
      .grid { display: grid; gap: 1rem; }
      /* Cell (ADR-0046): a grid child that spans columns or rows; its child fills it. */
      .cell { display: flex; flex-direction: column; gap: 1rem; min-width: 0; min-height: 0; }
      .cell > * { flex: 1 1 0; min-height: 0; }
      /* Frame (ADR-0046): a fixed design-size stage scaled to the window, never scrolling. */
      .frame-viewport { position: relative; width: 100%; overflow: hidden; }
      .frame-viewport.kiosk { position: fixed; inset: 0; z-index: 50; background: var(--bg); }
      /* A frame that fills the window leaves no room for the page's own footer. */
      body:has(.frame-viewport:not(.kiosk)) .status { display: none; }
      .frame-stage {
        position: absolute; left: 50%; top: 50%; box-sizing: border-box; overflow: hidden;
        display: grid; transform-origin: center center;
      }
      .frame-stage > * { min-width: 0; min-height: 0; }
      .sidebar-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
      .sidebar-layout > .sidebar-aside { flex: 0 0 min(240px, 34%); }
      .sidebar-layout > .sidebar-main { flex: 1 1 0; min-width: 0; }
      /* Collapse multi-column layouts to a single column on a phone. !important
         beats the inline grid-template-columns set from the columns prop. */
      @media (max-width: 560px) {
        .grid { grid-template-columns: minmax(0, 1fr) !important; }
        .frame-stage .grid { grid-template-columns: var(--cols) !important; }
        .sidebar-layout { flex-direction: column; align-items: stretch; }
        .sidebar-layout > .sidebar-aside { flex: none; width: 100%; }
      }

      .tabs { display: flex; flex-direction: column; gap: 0.9rem; }
      .tablist {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem;
        border-bottom: 1px solid var(--outline-soft);
      }
      .tab {
        font: inherit;
        font-weight: 600;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        align-self: auto;
      }
      .tab:hover { filter: none; color: var(--text); }
      .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
      .tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

      .expander {
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        background: var(--surface);
        overflow: hidden;
      }
      .expander-summary {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        font: inherit;
        font-weight: 600;
        color: var(--text);
        background: var(--surface-2);
        border: 0;
        border-radius: 0;
        padding: 0.6rem 0.9rem;
        cursor: pointer;
        align-self: auto;
        text-align: left;
      }
      .expander-summary:hover { filter: none; background: var(--surface-3); }
      .expander-caret {
        font-size: 0.7rem;
        color: var(--muted);
        transition: transform 0.15s ease;
      }
      .expander.open .expander-caret { transform: rotate(90deg); }
      .expander-body { display: flex; flex-direction: column; gap: 1rem; padding: 0.9rem; }

      /* Data-driven list / chat / gallery (ADR-0016). */
      .list { display: flex; flex-direction: column; gap: 0.4rem; }
      .list-item { font-size: 0.92rem; color: var(--text); }
      .list-empty { font-size: 0.9rem; color: var(--muted); font-style: italic; }
      /* one worked item template: a timestamped activity line (a code + a span) */
      .log-line { display: flex; gap: 0.55rem; align-items: baseline; }
      .log-line code {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--muted);
        flex: none;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        /* Fixed height (not a cap): the space is allocated up front so the box never
           stretches message by message - it just scrolls, like ChatGPT/Gemini. */
        height: 22rem;
        overflow-y: auto;
        padding: 0.4rem;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .chat-empty { color: var(--muted); font-style: italic; font-size: 0.9rem; padding: 0.35rem 0.4rem; }
      .bubble { display: flex; flex-direction: column; gap: 0.2rem; max-width: 85%; }
      .bubble-role {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .bubble-body {
        padding: 0.5rem 0.75rem;
        font-size: 0.92rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--outline-soft);
      }
      .bubble.role-user { align-self: flex-end; align-items: flex-end; }
      .bubble.role-user .bubble-body {
        color: var(--on-primary);
        background: var(--primary);
        border-color: transparent;
      }
      .bubble.role-system { align-self: center; max-width: 100%; }
      .bubble.role-system .bubble-body {
        background: transparent;
        border: 0;
        color: var(--muted);
        font-size: 0.82rem;
        text-align: center;
      }
      .bubble.pending .bubble-body::after {
        content: "▍";
        color: var(--primary);
        animation: indah-blink 1s step-end infinite;
      }
      @keyframes indah-blink { 50% { opacity: 0; } }
      .gallery { display: grid; gap: 0.6rem; }
      .gallery-item { margin: 0; }
      .gallery-item img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: var(--radius-sm);
        display: block;
        background: var(--surface-2);
      }
      .gallery-item figcaption {
        margin-top: 0.25rem;
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 560px) {
        .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      }

      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field-error { font-size: 0.8rem; color: var(--err); }
      .field input[aria-invalid="true"], .field select[aria-invalid="true"] {
        border-color: var(--err);
      }
      button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
      .field label, .stream-label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--muted);
      }

      input[type="range"] { width: 100%; accent-color: var(--primary); }
      .slider-value { margin-left: 0.5em; font-family: var(--font-mono, monospace); color: var(--text); }
      .slider-marks { position: relative; height: 1.9rem; margin-top: -0.2rem; }
      .slider-mark { position: absolute; top: 0; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); }
      .slider-mark i { width: 2px; height: 0.4rem; background: var(--muted); }
      .slider-mark small { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
      input[type="text"], input[type="number"], input[type="date"], input[type="search"],
      select, textarea {
        font: inherit;
        width: 100%;
        padding: 0.55rem 0.75rem;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      textarea { resize: vertical; line-height: 1.45; }
      input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
      input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus,
      input[type="search"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
      }
      select[multiple] { min-height: 5.5rem; }
      /* A long option label wraps in the closed control instead of clipping to "a serene mou..."
         (IND-233). Chromium only (base-select); elsewhere the native select is unchanged. */
      @supports (appearance: base-select) {
        select:not([multiple]), select:not([multiple])::picker(select) { appearance: base-select; }
        select:not([multiple]) {
          display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
          white-space: normal; text-align: left; cursor: pointer;
        }
        select:not([multiple]) > button {
          all: unset; flex: 1; min-width: 0; font: inherit; color: inherit;
          white-space: normal; text-align: left; cursor: pointer;
        }
        select:not([multiple])::picker(select) {
          background: var(--surface); color: var(--text);
          border: 1px solid var(--outline); border-radius: var(--radius-sm);
          padding: 0.25rem;
        }
        select:not([multiple]) option { padding: 0.45rem 0.6rem; white-space: normal; border-radius: 6px; }
        select:not([multiple]) option:hover, select:not([multiple]) option:checked { background: var(--primary-container); }
      }
      .check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.95rem;
        color: var(--text);
        cursor: pointer;
      }
      .check input { accent-color: var(--primary); width: 1.05rem; height: 1.05rem; flex: none; }
      .checkbox-fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
      .checkbox-fieldset legend { padding: 0; margin-bottom: 0.35rem; }
      .radio-group { display: flex; flex-direction: column; gap: 0.45rem; }
      .choice { --tone: var(--primary); display: flex; flex-wrap: wrap; gap: 0.4rem; }
      .choice-opt.tone-ok { --tone: var(--ok); }
      .choice-opt.tone-warn { --tone: var(--warn); }
      .choice-opt.tone-err { --tone: var(--err); }
      .choice-opt.tone-info { --tone: var(--primary); }
      button.choice-opt {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        align-self: auto;
        padding: 0.3rem 0.85rem;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: var(--radius-control);
        filter: none;
      }
      button.choice-opt:hover { background: var(--surface-2); filter: none; }
      button.choice-opt.tone-ok, button.choice-opt.tone-warn,
      button.choice-opt.tone-err, button.choice-opt.tone-info { color: var(--tone); }
      button.choice-opt.on {
        color: var(--on-primary-container);
        background: color-mix(in srgb, var(--tone) 16%, var(--surface));
        border-color: var(--tone);
      }
      button.choice-opt.on.tone-ok, button.choice-opt.on.tone-warn,
      button.choice-opt.on.tone-err, button.choice-opt.on.tone-info { color: var(--tone); }
      .choice-count {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0 0.4rem;
        border-radius: var(--radius-control);
        background: color-mix(in srgb, var(--tone) 14%, var(--surface-2));
        color: var(--muted);
      }
      .choice.segmented {
        display: inline-flex;
        flex-wrap: nowrap;
        gap: 0;
        align-self: flex-start;
        border: 1px solid var(--outline);
        border-radius: var(--radius-control);
        overflow: hidden;
        background: var(--surface);
      }
      .choice.segmented button.choice-opt {
        border: 0;
        border-radius: 0;
        padding: 0.4rem 1rem;
        background: transparent;
      }
      .choice.segmented button.choice-opt + button.choice-opt { border-left: 1px solid var(--outline); }
      .choice.segmented button.choice-opt.on {
        background: var(--tone);
        color: var(--on-primary);
      }
      .choice.segmented button.choice-opt.on .choice-count {
        background: color-mix(in srgb, var(--on-primary) 24%, transparent);
        color: var(--on-primary);
      }
      button.choice-opt:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .choice.segmented button.choice-opt:focus-visible { outline-offset: -3px; }
      input[type="color"] {
        width: 3rem;
        height: 2rem;
        padding: 2px;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .upload input[type="file"] {
        font: inherit;
        color: var(--text);
        padding: 0.4rem;
        background: var(--surface-2);
        border: 1px dashed var(--outline);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .upload-status { font-size: 0.85rem; color: var(--muted); }
      .camera { display: flex; flex-direction: column; gap: 0.4rem; max-width: 100%; }
      .camera-label { font-size: 0.85rem; color: var(--muted); }
      .camera-preview { width: 100%; max-width: 640px; background: #000; border-radius: 6px; }
      .camera-bar { display: flex; align-items: center; gap: 0.75rem; }
      .camera-status, .camera-message { font-size: 0.85rem; color: var(--muted); }
      .mic { display: flex; flex-direction: column; gap: 0.4rem; max-width: 100%; }
      .mic-label { font-size: 0.85rem; color: var(--muted); }
      .mic-bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
      .mic-meter { width: 80px; height: 6px; border-radius: 3px; background: var(--border, #8884); overflow: hidden; }
      .mic-meter span { display: block; height: 100%; background: var(--accent, #3b82f6); }
      .mic-status, .mic-message { font-size: 0.85rem; color: var(--muted); }

      a.download {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        align-self: start;
        padding: 0.45rem 0.9rem;
        font-size: 0.95rem;
        color: var(--primary);
        text-decoration: none;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      a.download:hover { border-color: var(--primary); }
      .download.disabled { color: var(--muted); opacity: 0.6; }

      .image { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: var(--radius-sm); display: block; margin-inline: auto; }
      .map { width: 100%; border-radius: var(--radius-sm); overflow: hidden; }
      .audio { max-width: 100%; width: 100%; display: block; }
      .audio-empty {
        display: inline-block; padding: 0.5rem 0.8rem; color: var(--muted);
        background: var(--surface-2); border: 1px dashed var(--outline);
        border-radius: var(--radius-sm); font-size: 0.9rem;
      }
      /* Image overlay (ADR-0020): boxes/masks/keypoints over an image, in % coords.
         .overlay-wrap is a fixed-size, overflow:hidden viewport (so a caller's
         out-of-[0,1] box, or a label pushed above a box near the top edge, is
         clipped rather than bleeding into surrounding page content); .ov-content is
         the one layer that gets scaled/panned for zoom (#77), so box/point percent
         coordinates need no adjustment at any zoom level. */
      .overlay-wrap {
        position: relative; display: inline-block; max-width: 100%; line-height: 0;
        overflow: hidden; touch-action: none;
      }
      .overlay-wrap.zoomed { cursor: grab; }
      .overlay-wrap.dragging { cursor: grabbing; }
      .ov-content { display: inline-block; }
      .overlay-wrap .image { width: 100%; }
      .ov-reset-btn {
        position: absolute; top: 0.5rem; right: 0.5rem; z-index: 1;
        font: 600 0.72rem/1 var(--font-body); padding: 0.35rem 0.6rem;
        border: 1px solid var(--outline); border-radius: var(--radius-sm);
        background: var(--surface); color: var(--text); cursor: pointer;
        box-shadow: var(--shadow);
      }
      .ov-reset-btn:hover { border-color: var(--primary); color: var(--primary); }
      .ov-mask {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border-radius: var(--radius-sm); pointer-events: none;
      }
      .ov-box {
        position: absolute; border: 2px solid var(--primary); border-radius: 3px;
        box-sizing: border-box; pointer-events: none;
      }
      /* label_mode="hover": no permanent .ov-label span, just a native `title`
         tooltip - needs pointer-events re-enabled to actually be a hover target. */
      .ov-box--hover { pointer-events: auto; cursor: default; }
      .ov-label {
        position: absolute; top: 0; left: 0; transform: translateY(-100%);
        font: 600 0.72rem/1.4 var(--font-body); color: #fff; padding: 0 0.35rem;
        white-space: nowrap; border-radius: 3px 3px 0 0;
      }
      .ov-point {
        position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
        border: 2px solid #fff; border-radius: 50%; pointer-events: auto;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
      }
      /* Client chart (uPlot, ADR-0018). Draw it on a surface and pull uPlot's
         chrome onto the Studio tokens so it reads in light and dark. */
      .chart { width: 100%; min-width: 0; max-width: 100%; overflow: hidden; }
      .field:has(> .chart) { min-width: 0; }
      /* height="fill": the plot takes whatever height its container (a card in a frame) gives. */
      .pie { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
      .pie svg { overflow: visible; flex: 0 0 auto; }
      .pie-slice { transition: opacity 150ms, transform 150ms; }
      .pie-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; }
      .pie-legend li { display: flex; align-items: center; gap: 0.5rem; transition: opacity 150ms; }
      .pie-legend li.lit { font-weight: 600; }
      .pie-swatch { width: 0.7rem; height: 0.7rem; border-radius: 3px; flex: 0 0 auto; }
      .pie-pct { font-family: var(--font-mono); color: var(--muted); margin-left: auto; padding-left: 0.5rem; }
      .field.fill { flex: 1 1 0; min-height: 0; }
      .field.fill > .chart, .field.fill > .heatmap { flex: 1 1 0; min-height: 0; overflow: hidden; }
      .chart .u-title {
        font-family: var(--font-display); font-size: 0.95rem; color: var(--text);
      }
      .chart .u-legend { font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); }
      .chart .u-legend .u-value { color: var(--text); }
      .chart:not(.hovering) .u-legend .u-value { display: none; }
      /* A live legend leads with the x series ("Value: --"); a labels-only legend has no such row. */
      .chart:not(.hovering):not(.legend-labels) .u-legend .u-series:first-child { display: none; }
      /* Client heatmap / 2-D field (ADR-0019). */
      .heatmap { width: 100%; display: flex; flex-direction: column; gap: 0.3rem; }
      .heatmap-empty { color: var(--muted); font-style: italic; font-size: 0.85rem; }
      .heatmap-title { font-family: var(--font-display); font-size: 0.95rem; color: var(--text); }
      .heatmap canvas {
        width: 100%; display: block; border-radius: var(--radius-sm);
        image-rendering: pixelated; background: var(--surface-2);
      }
      /* Interactive graph (ADR-0048). The stage holds the canvas; fill takes its container's height. */
      .graph { width: 100%; display: flex; flex-direction: column; gap: 0.4rem; }
      .graph-stage {
        position: relative; width: 100%; border-radius: var(--radius-sm);
        background: var(--surface-2); overflow: hidden; touch-action: none;
      }
      .graph.fill { flex: 1 1 0; min-height: 0; }
      .graph.fill .graph-stage { flex: 1 1 0; min-height: 12rem; }
      .graph-canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
      .graph-canvas:active { cursor: grabbing; }
      .graph-canvas:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
      .graph-legend {
        display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; margin: 0; padding: 0; list-style: none;
        font-size: 0.8rem; color: var(--muted);
      }
      .graph-swatch { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 50%; margin-right: 0.35rem; }
      .graph-empty { color: var(--muted); font-style: italic; font-size: 0.85rem; }
      .table-scroll { overflow-x: auto; }
      /* Density tokens: the app default comes from <html data-density>, one table can
         override with its own data-density. --row-h is the fixed row of a virtual table. */
      :root { --row-h: 36px; --cell-pad-y: 0.35rem; --cell-pad-x: 0.6rem; --table-font: 0.9rem; }
      [data-density="compact"] {
        --row-h: 26px; --cell-pad-y: 0.1rem; --cell-pad-x: 0.45rem; --table-font: 0.82rem;
      }
      [data-density="comfortable"] {
        --row-h: 36px; --cell-pad-y: 0.35rem; --cell-pad-x: 0.6rem; --table-font: 0.9rem;
      }
      .dataframe { border-collapse: collapse; font-size: var(--table-font); width: 100%; }
      .dataframe th, .dataframe td {
        border: 1px solid var(--outline-soft);
        padding: var(--cell-pad-y) var(--cell-pad-x);
        text-align: left;
        white-space: nowrap;
      }
      .dataframe th {
        background: var(--surface-2);
        font-weight: 600;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .dataframe td { font-variant-numeric: tabular-nums; }
      /* Interactive Table (ADR-0021): sortable headers, selectable rows, pager. */
      .table th { padding: 0; }
      .table .th-sort {
        display: flex; align-items: center; gap: 0.4rem; width: 100%;
        padding: var(--cell-pad-y) var(--cell-pad-x); background: none; border: none; cursor: pointer;
        font: inherit; color: inherit; text-align: left;
      }
      .table .th-sort:hover { background: var(--surface-3); }
      .table .sort-caret { color: var(--muted); font-size: 0.7rem; }
      .table.selectable tbody tr { cursor: pointer; }
      .table.selectable tbody tr:hover { background: var(--surface-2); }
      .table tbody tr.selected { background: var(--primary-container); }
      /* Rich table (ADR-0027): sticky header, typed cells. */
      .table-scroll.rich { overflow: auto; }
      /* border-collapse borders do not travel with a sticky header, so rows showed through
         above it; separate borders plus an opaque header and a drawn bottom edge fix that. */
      .table.rich { border-collapse: separate; border-spacing: 0; }
      .table.rich th, .table.rich td { border-width: 0 0 1px 0; }
      .table.rich thead th {
        position: sticky; top: 0; z-index: 2;
        background: var(--surface-2); box-shadow: 0 1px 0 var(--outline);
      }
      .table.rich .num, .table.rich th.num .th-sort { text-align: right; justify-content: flex-end; }
      .table.rich td { vertical-align: middle; }
      .cell-mono {
        display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; font-family: var(--font-mono); font-size: 0.82rem;
      }
      .table.rich td.trunc {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .table.rich td.wrap { white-space: normal; overflow-wrap: anywhere; }
      /* Keyboard navigation (IND-164): the ring shows only while the table has keyboard focus. */
      .table.rich[role=grid]:focus { outline: none; }
      .table.rich[role=grid]:focus-visible tr.kb-active > td {
        background: var(--surface-3);
        box-shadow: inset 0 2px 0 var(--primary), inset 0 -2px 0 var(--primary);
      }
      .table.rich[role=grid]:focus-visible tr.kb-active > td:first-child { box-shadow: inset 2px 2px 0 var(--primary), inset 0 -2px 0 var(--primary); }
      .table.rich[role=grid]:focus-visible tr.kb-active > td:last-child { box-shadow: inset -2px 2px 0 var(--primary), inset 0 -2px 0 var(--primary); }
      .table.rich td.cell-rich { white-space: nowrap; }
      .table.rich td.cell-rich.wrap { white-space: normal; }
      /* Table narrow="cards" (IND-258): under the shared narrow breakpoint (NARROW in src/stores.js;
         @media cannot read it, so 560px is repeated) each row is a bordered card. The first
         labelled cell is the heading; the others print their data-label (set by the shell). */
      @media (max-width: 560px) {
        .table.rich.cards, .table.rich.cards tbody { display: block; }
        .table.rich.cards thead { display: none; }
        .table.rich.cards tbody tr {
          display: block; margin: 0 0 0.6rem; background: var(--surface);
          border: 1px solid var(--outline); border-radius: var(--radius);
        }
        .table.rich.cards td {
          display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
          border-width: 0; max-width: none; white-space: normal; overflow-wrap: anywhere;
          text-align: right;
        }
        .table.rich.cards td[data-label]::before {
          content: attr(data-label); flex: none; color: var(--muted); font-size: 0.78rem;
          text-align: left;
        }
        .table.rich.cards td[data-label]:not(td[data-label] ~ *) {
          display: block; font-weight: 600; text-align: left;
          border-bottom: 1px solid var(--outline);
        }
        .table.rich.cards td[data-label]:not(td[data-label] ~ *)::before { display: none; }
        .table.rich.cards td.actions-col { flex-wrap: wrap; justify-content: flex-start; }
        .table.rich.cards tbody tr.selected {
          border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary);
        }
        .table.rich.cards[role=grid]:focus-visible tr.kb-active {
          border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary);
        }
        .table.rich.cards[role=grid]:focus-visible tr.kb-active > td,
        .table.rich.cards[role=grid]:focus-visible tr.kb-active > td:first-child,
        .table.rich.cards[role=grid]:focus-visible tr.kb-active > td:last-child {
          background: none; box-shadow: none;
        }
      }
      .cell-badge {
        display: inline-block; padding: 0.05rem 0.55rem; border-radius: var(--radius-pill);
        font-size: 0.78rem; font-weight: 600; line-height: 1.5;
        background: var(--surface-3); color: var(--text);
      }
      .cell-badge.tone-ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
      .cell-badge.tone-warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
      .cell-badge.tone-err { background: color-mix(in srgb, var(--err) 16%, var(--surface)); color: var(--err); }
      .cell-badge.tone-info { background: var(--primary-container); color: var(--on-primary-container); }
      .table-toolbar {
        display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
        margin-bottom: 0.5rem; font-size: 0.85rem;
      }
      .table-search { flex: 1 1 12rem; max-width: 22rem; padding: 0.3rem 0.6rem; }
      .table-count { color: var(--muted); }
      .table-selection {
        display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
        margin-bottom: 0.5rem; font-size: 0.85rem;
      }
      .table-selection button { padding: 0.2rem 0.7rem; font-size: 0.85rem; }
      .col-toggle { position: relative; }
      .col-toggle summary { cursor: pointer; color: var(--muted); user-select: none; }
      .col-toggle-menu {
        position: absolute; z-index: 5; margin-top: 0.3rem; padding: 0.4rem 0.7rem;
        background: var(--surface); border: 1px solid var(--outline);
        border-radius: var(--radius-sm); box-shadow: var(--shadow);
        display: flex; flex-direction: column; gap: 0.25rem; min-width: 9rem;
      }
      .col-toggle-menu label { display: flex; gap: 0.5rem; align-items: center; cursor: pointer; }
      .follow-resume { padding: 0.2rem 0.7rem; font-size: 0.85rem; }
      .table-pager {
        display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem;
        font-size: 0.85rem; color: var(--muted);
      }
      .table-pager button { padding: 0.2rem 0.7rem; font-size: 0.85rem; }
      /* Metric / KPI card (ADR-0021). */
      .stat {
        display: flex; flex-direction: column; gap: 0.15rem;
        background: var(--surface); border: 1px solid var(--outline-soft);
        border-radius: var(--radius-sm); padding: 0.8rem 1rem;
      }
      .stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
      .stat-value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
      .stat-delta { font-size: 0.85rem; font-weight: 600; color: var(--ok); }
      .stat-delta.down { color: var(--err); }
      .stat-help { font-size: 0.78rem; color: var(--muted); }
      /* Plain Text roles (ADR-0040). Body is the default; readout is the old large figure. */
      .text { font-size: 0.95rem; font-weight: 400; line-height: 1.55; white-space: pre-line; }
      .text.tone-err { color: var(--err); }
      .text.tone-err:empty { display: none; }
      .text.t-title { font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
      .text.t-label { font-size: 0.85rem; font-weight: 500; line-height: 1.4; color: var(--muted); }
      .text.t-caption { font-size: 0.78rem; line-height: 1.4; color: var(--muted); }
      .text.t-mono { font-family: var(--font-mono); font-size: 0.88rem; white-space: pre-wrap; }
      .text.t-readout { font-size: 1.4rem; font-weight: 600; line-height: normal; white-space: normal; font-variant-numeric: tabular-nums; }
      .streamtext {
        min-height: 3.5rem;
        padding: 0.7rem 0.9rem;
        font-size: 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
      }
      .streamtext:empty::after { content: "…"; color: var(--muted); }

      /* Markdown rendered from the safe block tree (src/indah/markdown.py). */
      .markdown { font-size: 0.95rem; line-height: 1.6; color: var(--text); }
      .markdown > :first-child { margin-top: 0; }
      .markdown > :last-child { margin-bottom: 0; }
      .markdown h1, .markdown h2, .markdown h3, .markdown h4,
      .markdown h5, .markdown h6 {
        line-height: 1.25;
        margin: 0.7em 0 0.35em;
        font-family: var(--font-display);
        font-weight: 700;
      }
      .markdown h1 { font-size: 1.5rem; }
      .markdown h2 { font-size: 1.3rem; }
      .markdown h3 { font-size: 1.12rem; }
      .markdown h4, .markdown h5, .markdown h6 { font-size: 1rem; }
      .markdown p { margin: 0.5em 0; }
      .markdown a { color: var(--primary); text-decoration: underline; }
      .markdown strong { font-weight: 700; }
      .markdown code {
        font-family: var(--font-mono);
        font-size: 0.88em;
        background: var(--surface-2);
        padding: 0.1em 0.35em;
        border-radius: 6px;
      }
      .markdown pre {
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        padding: 0.8rem 0.9rem;
        overflow-x: auto;
      }
      .markdown pre code { background: none; padding: 0; font-size: 0.85rem; }
      .markdown ul, .markdown ol { margin: 0.4em 0; padding-left: 1.4em; }
      .markdown li { margin: 0.2em 0; }
      .markdown blockquote {
        margin: 0.5em 0;
        padding: 0.2em 0.9em;
        border-left: 3px solid var(--outline);
        color: var(--muted);
      }
      .markdown hr { border: 0; border-top: 1px solid var(--outline-soft); margin: 0.9em 0; }

      /* Progress bar + spinner (Slice A). */
      .progress {
        width: 100%;
        height: 0.6rem;
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        border-radius: var(--radius-pill);
        overflow: hidden;
        background: var(--surface-3);
        color: var(--primary); /* Firefox indeterminate fill */
      }
      .progress::-webkit-progress-bar { background: var(--surface-3); border-radius: var(--radius-pill); }
      .progress::-webkit-progress-value { background: var(--primary); border-radius: var(--radius-pill); }
      .progress::-moz-progress-bar { background: var(--primary); border-radius: var(--radius-pill); }
      .skeleton { display: flex; flex-direction: column; gap: 0.6rem; width: 100%; }
      .skeleton-line {
        display: block; width: 100%; border-radius: var(--radius-sm);
        background: var(--surface-3); animation: skeleton-pulse 1.4s ease-in-out infinite;
      }
      @keyframes skeleton-pulse { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .skeleton-line { animation: none; } }
      .spinner-box {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .spinner {
        width: 1.1rem;
        height: 1.1rem;
        flex: none;
        border-radius: 50%;
        border: 2.5px solid var(--surface-3);
        border-top-color: var(--primary);
        animation: indah-spin 0.7s linear infinite;
      }
      @keyframes indah-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }

      button {
        font: inherit;
        font-weight: 600;
        color: var(--on-primary);
        background: var(--primary);
        border: 0;
        border-radius: var(--radius-control);
        padding: 0.55rem 1.3rem;
        cursor: pointer;
        align-self: flex-start;
        transition: filter 0.15s, transform 0.05s;
      }
      button:hover { filter: brightness(1.06); }
      button:active { transform: translateY(1px); }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      /* Studio secondary actions: tonal (teal container) and ghost (outline). */
      button.tonal { color: var(--on-secondary-container); background: var(--secondary-container); }
      button.tonal:hover { filter: brightness(0.97); }
      button.ghost {
        color: var(--primary);
        background: transparent;
        border: 1px solid var(--outline);
      }
      button.ghost:hover { filter: none; background: var(--surface-2); }
      /* danger (IND-252): an outlined button in the error colour, for delete and reject. */
      button.danger {
        color: var(--err);
        background: transparent;
        border: 1px solid var(--err);
      }
      button.danger:hover { filter: none; background: color-mix(in srgb, var(--err) 10%, transparent); }
      button.danger:focus-visible { outline-color: var(--err); }

      .badge {
        align-self: flex-start;
        display: inline-block;
        padding: 0.1rem 0.55rem;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: var(--radius-control);
        background: var(--surface-2);
        color: var(--muted);
      }
      /* Marked (IND-157): shaded spans. The tone is never colour alone: each has its own underline. */
      .marked { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
      .marked-block { margin: 0.25rem 0; }
      .marked .mk {
        color: inherit;
        padding: 0 0.1em;
        border-radius: 0.2em;
        background: color-mix(in srgb, var(--tone, var(--muted)) 22%, transparent);
        text-decoration-line: underline;
        text-decoration-color: var(--tone, var(--muted));
        text-decoration-thickness: 1.5px;
        text-underline-offset: 0.2em;
      }
      .marked .mk.tone-neutral { text-decoration-line: none; }
      .marked .mk.tone-ok { --tone: var(--ok); text-decoration-style: solid; }
      .marked .mk.tone-warn { --tone: var(--warn); text-decoration-style: dashed; }
      .marked .mk.tone-err { --tone: var(--err); text-decoration-style: wavy; }
      .marked .mk.tone-info { --tone: var(--primary); text-decoration-style: dotted; }
      /* Steps (IND-163): a timeline. Each state has its own drawing, so none relies on colour. */
      .steps { list-style: none; margin: 0.25rem 0; padding: 0; display: flex; --step-glyph: 1rem; }
      .steps-v { flex-direction: column; }
      .steps-h { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
      .step { position: relative; display: flex; gap: 0.55rem; align-items: flex-start; color: var(--text); }
      .steps-v .step { padding-bottom: 0.8rem; }
      .steps-v .step:last-child { padding-bottom: 0; }
      .steps-v .step:not(:last-child)::after {
        content: ""; position: absolute; left: calc(var(--step-glyph) / 2 - 1px);
        top: calc(var(--step-glyph) + 0.15rem); bottom: 0.15rem; width: 2px;
        background: var(--outline-soft);
      }
      .steps-v .step.st-done:not(:last-child)::after { background: var(--ok); }
      .steps-h .step:not(:last-child)::after {
        content: ""; flex: 0 0 1.1rem; height: 2px; margin: calc(var(--step-glyph) / 2 - 1px) 0.55rem 0;
        background: var(--outline-soft);
      }
      .steps-h .step.st-done:not(:last-child)::after { background: var(--ok); }
      .step-glyph { flex: none; width: var(--step-glyph); height: var(--step-glyph); overflow: visible; }
      .step-glyph .g-fill { fill: currentColor; stroke: none; }
      .step-glyph .g-ring { fill: none; stroke: currentColor; stroke-width: 1.6; }
      .step-glyph .g-dash { stroke-dasharray: 2.6 2.4; }
      .step-glyph .g-mark, .step-glyph .g-bar {
        fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      }
      .step-glyph .g-mark { stroke: var(--surface); }
      .step-glyph .g-bar { stroke: currentColor; }
      .step-body { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
      .step-label { font-size: 0.95rem; overflow-wrap: anywhere; }
      .step-detail { font-size: 0.78rem; color: var(--muted); }
      .st-done .step-glyph { color: var(--ok); }
      .st-current .step-glyph { color: var(--primary); }
      .st-current .step-label { font-weight: 600; }
      .st-skipped .step-glyph, .st-pending .step-glyph { color: var(--muted); }
      .st-skipped .step-label { color: var(--muted); text-decoration: line-through; }
      .st-pending .step-label { color: var(--muted); }
      .st-off .step-glyph { color: var(--outline); }
      .st-off .step-label { color: var(--muted); font-style: italic; }
      .steps-compact { margin: 0; --step-glyph: 0.8rem; flex-wrap: nowrap; }
      .steps-compact .step { gap: 0.3rem; align-items: center; white-space: nowrap; }
      .steps-compact .step-label { font-size: 0.82rem; }
      .steps-compact.steps-h .step:not(:last-child)::after { flex-basis: 0.6rem; margin: 0 0.3rem; }
      .badge.tone-ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
      .badge.tone-warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
      .badge.tone-err { background: color-mix(in srgb, var(--err) 16%, var(--surface)); color: var(--err); }
      .badge.tone-info { background: var(--primary-container); color: var(--primary); }
      .secret {
        display: grid;
        gap: 0.5rem;
        padding: 0.85rem 1rem;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-left: 4px solid var(--primary);
        border-radius: var(--radius, 10px);
      }
      .secret-label { font-weight: 600; }
      .secret-value {
        font-family: var(--font-mono);
        font-size: 0.92rem;
        padding: 0.5rem 0.65rem;
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: 6px;
       
        user-select: all;
      }
      .secret-note { color: var(--muted); font-size: 0.85rem; }
      .secret-actions { display: flex; gap: 0.5rem; }
      .code-block {
        display: grid;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: var(--radius, 10px);
        overflow: hidden;
      }
      .code-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.25rem 0.4rem 0.25rem 0.75rem;
        border-bottom: 1px solid var(--outline-soft, var(--outline));
        user-select: none;
      }
      .code-lang { color: var(--muted); font-size: 0.78rem; font-family: var(--font-mono); }
      button.code-copy { padding: 0.2rem 0.6rem; font-size: 0.8rem; min-height: 0; margin-left: auto; }
      .code-pre {
        margin: 0;
        padding: 0.7rem 0.85rem;
        overflow: auto;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        line-height: 1.5;
        color: var(--text);
      }
      .code-pre code { font: inherit; white-space: pre; }
      .code-pre:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
      .empty-state {
        display: grid;
        justify-items: center;
        gap: 0.6rem;
        padding: 2rem 1rem;
        text-align: center;
      }
      .empty-state > .code-block { justify-self: stretch; max-width: 36rem; width: 100%; text-align: left; }
      .empty-body { color: var(--muted); max-width: 36rem; }
      .empty-action { margin-top: 0.4rem; }
      .switch-row { display: flex; align-items: center; gap: 0.6rem; }
      .switch-label { font-size: 0.95rem; }
      button.switch {
        position: relative;
        width: 2.5rem;
        height: 1.4rem;
        padding: 0;
        flex: none;
        align-self: center;
        background: var(--surface-3);
        border: 1px solid var(--outline);
      }
      button.switch[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
      .switch-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: calc(1.4rem - 6px);
        height: calc(1.4rem - 6px);
        border-radius: 50%;
        background: var(--surface);
        transition: transform 0.15s;
      }
      button.switch[aria-checked="true"] .switch-knob { transform: translateX(1.1rem); }
      .shortcut-help { border-collapse: collapse; width: 100%; }
      .shortcut-help td { padding: 0.3rem 0.4rem; font-size: 0.9rem; }
      .shortcut-help td:first-child { white-space: nowrap; }
      .then { color: var(--muted); font-size: 0.8rem; }
      kbd {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 0.05rem 0.4rem;
        background: var(--surface-2);
        border: 1px solid var(--outline);
        border-radius: 4px;
      }
      .table-scroll.virtual { overflow-y: auto; }
      .table-scroll.virtual table { table-layout: fixed; width: 100%; }
      .table-scroll.virtual tbody tr:not(.vspacer) { height: var(--row-h); }
      .table-scroll.virtual tbody td {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-top: 0;
        padding-bottom: 0;
      }
      .table-scroll.virtual .actions-col { width: 13rem; }
      tr.vspacer td { padding: 0; border: 0; }
      tr.ph td { color: var(--muted); }
      .check-col { width: 2rem; text-align: center; }
      .actions-col { white-space: nowrap; text-align: right; }
      button.row-action { padding: 0.15rem 0.7rem; font-size: 0.8rem; margin-left: 0.3rem; align-self: auto; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }
      /* BarStrip (IND-162): a compact strip of bars, not a chart. Tones are the theme variables. */
      .barstrip { position: relative; width: 100%; border-radius: var(--radius-sm); }
      .barstrip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .barstrip-bars {
        display: flex; align-items: flex-end; gap: 2px;
        border-bottom: 1px solid var(--outline-soft);
      }
      .barstrip-bar {
        flex: 1 1 0; min-width: 1px; height: 100%;
        display: flex; flex-direction: column-reverse;
        border-radius: 1px 1px 0 0;
      }
      .barstrip-bar.on { background: var(--surface-3); }
      .barstrip-seg { flex: none; width: 100%; background: var(--muted); }
      .barstrip-seg + .barstrip-seg { box-shadow: inset 0 -1px 0 var(--bg); }
      .barstrip-seg.tone-ok { background: var(--ok); }
      .barstrip-seg.tone-warn { background: var(--warn); }
      .barstrip-seg.tone-err { background: var(--err); }
      .barstrip-seg.tone-info { background: var(--primary); }
      .barstrip-seg.tone-neutral { background: var(--muted); }
      @media (prefers-reduced-motion: no-preference) {
        .barstrip-seg { transition: height 0.2s ease; }
      }
      .barstrip-tip {
        position: absolute; bottom: calc(100% + 6px); z-index: 70; white-space: nowrap;
        padding: 0.3rem 0.6rem; font-size: 0.8rem; color: var(--text);
        background: var(--surface-3); border: 1px solid var(--outline);
        border-radius: var(--radius-sm); box-shadow: var(--shadow); pointer-events: none;
      }
      a.link { color: var(--primary); text-decoration: none; font-weight: 600; }
      a.link:hover { text-decoration: underline; }
      a.link.active {
        color: var(--text);
        background: var(--primary-container);
        padding: 0.1rem 0.5rem;
        border-radius: var(--radius-pill);
      }
      a.navitem {
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.45rem 0.7rem; border-radius: var(--radius-control, var(--radius));
        color: var(--text); text-decoration: none; font-weight: 500;
      }
      a.navitem:hover { background: var(--surface-2); }
      a.navitem.active { background: var(--primary-container); color: var(--on-primary-container); }
      a.navitem:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
      .navitem-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .navitem-badge {
        min-width: 1.4rem; padding: 0.05rem 0.45rem; text-align: center; font-size: 0.75rem;
        font-weight: 600; border-radius: var(--radius-pill);
        background: var(--primary); color: var(--on-primary);
      }
      .confirm-actions { display: flex; justify-content: flex-end; gap: 0.6rem; }

      .signed-out {
        margin: 4rem auto;
        max-width: 24rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .signed-out h2 { margin: 0 0 0.5rem; font-family: var(--font-display); }
      .signed-out p { margin: 0 0 1rem; color: var(--muted); }
      .status {
        margin-top: 1.4rem;
        font-size: 0.75rem;
        color: var(--muted);
        font-family: var(--font-mono);
        display: flex;
        gap: 0.45rem;
        align-items: center;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent);
      }
      .toasts {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        transform: translateX(-50%);
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: center;
      }
      .toast {
        max-width: min(520px, 92vw);
        padding: 0.7rem 1rem;
        font: inherit;
        font-size: 0.85rem;
        text-align: left;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--outline);
        border-left: 3px solid var(--primary);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      .toast.success { border-left-color: var(--ok); }
      .toast.warn { border-left-color: var(--warn); }
      .toast.error { border-left-color: var(--err); }
      .toast.has-action {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        cursor: default;
      }
      .toast-text { flex: 1; min-width: 0; }
      .toast-action,
      .toast-close {
        font: inherit;
        color: var(--primary);
        background: transparent;
        border: 0;
        border-radius: var(--radius-sm);
        cursor: pointer;
        padding: 0.15rem 0.4rem;
      }
      .toast-action { font-weight: 600; }
      .toast-close { color: var(--muted); font-size: 1.1rem; line-height: 1; }
      .toast-action:hover,
      .toast-close:hover { background: var(--surface-2); }
      /* Phone fit (IND-259): every control is at least 44x44 under 560 px or on a coarse pointer.
         560px is the shared narrow breakpoint (NARROW in src/stores.js); Table cards reuse it. */
      @media (max-width: 560px), (pointer: coarse) {
        button, select:not([multiple]), textarea,
        input:is([type="text"], [type="number"], [type="date"], [type="search"]) {
          min-height: 44px;
        }
        button { min-width: 44px; }
        .check, .radio-group .check { min-height: 44px; }
        .theme-toggle button { width: 44px; height: 44px; }
      }

    <script>
      // Resolve the saved theme choice (light / dark / system) into data-theme
      // before first paint, so dark never flashes light. The toggle in the shell
      // writes localStorage["indah-theme"]; "system" (the default) follows the OS.

        try {
          var choice = localStorage.getItem("indah-theme") || "system";
          var dark =
            choice === "dark" ||
            (choice === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
