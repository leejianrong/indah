[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indah"
version = "0.1.0rc1"
description = "A Python UI framework for ephemeral cloud notebooks (Colab, Runpod). Reactive, single-port, no Node required."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian Lee", email = "leejianrong2@gmail.com" }]
keywords = ["ui", "framework", "colab", "runpod", "notebook", "reactive", "gradio", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Framework :: AsyncIO",
]
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/leejianrong/indah"
Repository = "https://github.com/leejianrong/indah"
Issues = "https://github.com/leejianrong/indah/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/indah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests of a single unit",
    "integration: tests across the HTTP/SSE boundary without a browser",
    "e2e: end-to-end tests through a real launched app / browser",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
