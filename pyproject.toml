[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indah"
version = "0.10.1"
description = "A Python UI framework for ephemeral cloud notebooks (Colab, Runpod). Reactive, single-port, no Node required."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian Lee", email = "leejianrong2@gmail.com" }]
keywords = ["ui", "framework", "colab", "runpod", "notebook", "reactive", "gradio", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Framework :: AsyncIO",
]
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2",
    # Multipart parsing for the file-upload route (ADR-0017). Starlette needs it to
    # read multipart/form-data; it is pure Python, so it keeps the no-Node story.
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/leejianrong/indah"
Repository = "https://github.com/leejianrong/indah"
Issues = "https://github.com/leejianrong/indah/issues"

[project.optional-dependencies]
# Feature extras (ADR-0042). indah duck-types these libraries, so none is required; an extra only
# documents a tested floor and keeps the library out of the base install. Install with, for
# example, `pip install "indah[plot]"`. `all` is the union of the feature extras and never holds
# tooling or the demo libraries.
plot = [
    "matplotlib>=3.7",
]
data = [
    "pandas>=2.0",
    "numpy>=1.24",
]
# The Redis state store (ADR-0043, IND-210): imported on use, so the base install does not carry it.
redis = [
    "redis>=5",
]
# The Tier 1 live media WebSocket (ADR-0045): uvicorn serves a WebSocket only with one of these
# installed. Off by default, so the base install does not carry it.
live = [
    "websockets>=12",
]
# What the gallery demos and the examples need; the gallery image installs `indah[demos]`.
demos = [
    "numpy>=1.24",
    "pillow>=10",
    "onnxruntime>=1.17",
    "huggingface_hub>=0.23",
    "matplotlib>=3.7",
]
all = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "redis>=5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    # Only for the OIDC recipe's test (examples/oidc_login.py): the example needs them, indah
    # itself does not (ADR-0033: no auth in core).
    "authlib>=1.3",
    "itsdangerous>=2",
    "cryptography>=42",
    # The deploy recipes test (tests/unit/test_deploy_recipes.py) parses their YAML.
    "pyyaml>=6",
    # The Redis state store (indah/redis_store.py) is tested against an in-process fake; a real
    # Redis is opt-in (mark `redis`, INDAH_TEST_REDIS_URL).
    "redis>=5",
    "fakeredis>=2.23",
    # The live media route (ADR-0045) is tested in-process, and needs this to build.
    "websockets>=12",
]
# The browser layer of the e2e suite (marked `e2e`). Kept out of `dev`/the fast
# gate so `uv sync --extra dev` stays light and Node/browser-free; CI installs it
# only for the dedicated browser-e2e job (which also runs `playwright install`).
e2e = [
    "playwright>=1.40",
    # A real uvicorn serving the live WebSocket to a browser (tests/e2e/test_live_camera.py).
    "websockets>=12",
    # Runs the Studio-in-Pyodide check on several workers (tests/e2e/test_studio_pyodide.py).
    "pytest-xdist>=3.5",
]
# The documentation site (website/, built with Zensical -> GitHub Pages). Kept out
# of `dev` so the fast dev loop stays light; CI installs it for the docs job.
docs = [
    "zensical>=0.0.62",
]

[tool.hatch.build.targets.wheel]
packages = ["src/indah"]

# The sdist carries what a source build and its tests need, not the demos: examples/ (about 5 MB, with
# the Colab notebooks) and the gallery thumbnails stay in the repository (ADR-0042). The wheel is not
# affected; tests/integration/test_sdist.py checks that the wheel built from the sdist equals the one
# built from the tree, and tests/conftest.py skips the tests that read examples/ when it is absent.
[tool.hatch.build.targets.sdist]
exclude = [
    "/examples",
    "/deploy/fly/thumbnails",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests of a single unit",
    "integration: tests across the HTTP/SSE boundary without a browser",
    "e2e: end-to-end tests through a real launched app / browser",
    "pyodide: every runnable Studio page runs in the browser with Pyodide (ADR-0041); own CI job",
    "expects_csp_violation: this e2e test provokes a CSP violation on purpose (see conftest)",
    "redis: runs against a real Redis at INDAH_TEST_REDIS_URL; skipped when it is not set",
    "multireplica: three replicas + Redis + two balancers in Docker (IND-211); opt-in with INDAH_TEST_MULTIREPLICA=1",
    "raw_events: post events without the tab connecting first (see tests/integration/conftest.py)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
# The Colab demo notebooks are generated (deploy/colab/make_colab.py) and contain
# shell magics + long raw-GitHub URLs; the generator itself is linted, they are not.
extend-exclude = ["examples/colab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Studio pages carry prose summaries as long string literals.
[tool.ruff.lint.per-file-ignores]
"examples/studio/**" = ["E501"]
