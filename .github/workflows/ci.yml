name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (principle 7).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  # Fast layer: unit + integration. No external infra, so it runs everywhere
  # and mirrors the pre-push hook (principles 1, 6).
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - name: Unit + integration tests
        run: uv run pytest -m "unit or integration" -q

  # Rebuild the Svelte shell and fail if the committed bundle is stale (ADR-0004).
  # This is the only job that needs Node; installing/running indah never does.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build the shell
        run: npm run build
        working-directory: frontend
      - name: Check the committed shell is up to date
        run: |
          if ! diff -q frontend/dist/index.html src/indah/static/index.html; then
            echo "::error::src/indah/static/index.html is stale; run 'make frontend' and commit the result."
            exit 1
          fi

  # Heavy layer: renders the pre-built shell in a real Chromium and asserts the
  # DOM patches through the SSE round-trip. Kept off the fast gate; the only job
  # besides `frontend` that pulls a browser (indah itself still needs no Node).
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra e2e
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: End-to-end tests (real browser)
        run: uv run pytest -m e2e -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build
      - name: Verify metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
