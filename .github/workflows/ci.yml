name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (principle 7).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  # Fast layer: unit + integration. No external infra, so it runs everywhere
  # and mirrors the pre-push hook (principles 1, 6).
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - name: Unit + integration tests
        run: uv run pytest -m "unit or integration" -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build
      - name: Verify metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Heavy layer (browser / real launched app) is added with Slice 1, when
  # there is a stack to boot. Tracked in SLICES.md V1. Placeholder job keeps
  # the required-check name stable once branch protection is on.
